<div class="auth-brand">
    {% if site_settings and site_settings.logo %}
        <img
            src="{{ url_for('static', filename=site_settings.logo) }}"
            alt="{{ site_settings.company_name }} logo"
            class="auth-brand-logo"
        >
    {% else %}
        <div class="login-logo" aria-hidden="true">
            {{ (site_settings.company_name[:1] if site_settings and site_settings.company_name else 'A')|upper }}
        </div>
    {% endif %}

    <div class="auth-brand-copy">
        <strong>{{ site_settings.company_name if site_settings else 'Administration' }}</strong>
        <span>Administration Portal</span>
    </div>
</div>
